{{ define "main" }}
<article class="dashboard" data-dashboard="{{ .Params.dashboard }}">
  <header class="dashboard-header">
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </header>
  <p class="dashboard-update" id="dashboard-update" aria-live="polite">正在加载数据…</p>
  <div id="dashboard-content"></div>
</article>
<script src="/js/dashboard.js" defer></script>
{{ end }}
