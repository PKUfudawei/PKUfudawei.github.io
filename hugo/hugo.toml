baseURL = "https://PKUfudawei.github.io/"
locale = "en-US"
title = "Dawei Fu"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  author = "Dawei Fu"
  description = "Personal website of Dawei Fu"
  # PaperMod appearance toggles
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  comments = false

  # Home hero (lilianweng.github.io style): greeting title + centered social icons
  [params.homeInfoParams]
    Title = "😊Go with vibe!"
    AlignSocialIconsTo = "center"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/PKUfudawei"
    title = "GitHub"
  [[params.socialIcons]]
    name = "googlescholar"
    url = "https://scholar.google.com/citations?user=87YQFMQAAAAJ&hl=en"
    title = "Google Scholar"

[menu]
  [[menu.main]]
    name = "Blogs"
    url = "/"
    weight = 1
