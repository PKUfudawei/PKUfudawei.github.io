name: Update conference and LLM dashboards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/update_dashboards.py
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true
      - run: hugo --source hugo --destination .. --minify
      - name: Commit updated site
        run: |
          git add hugo/static/data/dashboards.json data/dashboards.json ai-conference-due/index.html llm-evaluation/index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update conference and LLM dashboard data'
          git push
